<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · BitChord addon</title>
<link rel="stylesheet" href="/setup/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Ccircle cx='8' cy='21' r='3' fill='%2322c55e'/%3E%3Ccircle cx='19' cy='18' r='3' fill='%2322c55e'/%3E%3Cpath d='M11 21V9l11-2v11' fill='none' stroke='%2322c55e' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<header>
  <div class="brand-group">
    <a class="brand" href="/setup">BitChord Selfhosted Addon</a>
    <span class="version-tag">{{formatVersion .Version}}</span>
    <a class="repo" href="https://github.com/rairulyle/bitchord-selfhosted-addon" target="_blank" rel="noopener" aria-label="GitHub repository">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
  </div>
  {{if .SignedIn}}
  <nav>
    <a href="/setup">Servers</a>
    <a href="/setup/password">Password</a>
    <form method="post" action="/setup/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link">Sign out</button></form>
  </nav>
  {{end}}
</header>
<main>
  {{if .Notice}}<p class="notice" role="status">{{.Notice}}</p>{{end}}
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  {{template "content" .}}
</main>
<script>
(function () {
  var notice = document.querySelector('p.notice');
  if (!notice) return;
  if (location.search.indexOf('notice=') !== -1) {
    var url = new URL(location.href);
    url.searchParams.delete('notice');
    history.replaceState(null, '', url);
  }
  setTimeout(function () {
    notice.style.opacity = '0';
    setTimeout(function () { notice.remove(); }, 400);
  }, 5000);
})();
</script>
</body>
</html>
